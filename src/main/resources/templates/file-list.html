<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>File Explorer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f2f2f2; }
        .error { color: red; }
    </style>
    <script>
        function fetchUrlById(fileId) {
            fetch('/files/url-by-id?fileId=' + encodeURIComponent(fileId))
                .then(response => response.text())
                .then(url => alert('File URL: ' + url))
                .catch(error => alert('Error: ' + error));
        }
    </script>
</head>
<body>
<h1>File Explorer</h1>
<p>Current Path: /<span th:text="${currentPath}"></span></p>
<div th:if="${error}" class="error" th:text="${error}"></div>
<div th:if="${fileId}" th:text="'Uploaded file ID: ' + ${fileId}"></div>

<!-- Upload Form -->
<form method="post" enctype="multipart/form-data" th:action="@{/files/upload}">
    <input type="hidden" name="path" th:value="${currentPath}"/>
    <input type="file" name="file"/>
    <button type="submit">Upload</button>
</form>

<!-- File Listing -->
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Size</th>
        <th>File ID</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${currentPath != ''}">
        <td><a th:href="@{/files(path=${currentPath.substring(0, currentPath.lastIndexOf('/'))})}">..</a></td>
        <td>Parent Directory</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
    </tr>
    <tr th:each="file : ${files}">
        <td>
            <a th:if="${file.directory}" th:href="@{/files(path=${currentPath + (currentPath == '' ? '' : '/') + file.name})}" th:text="${file.name}"></a>
            <!-- For .doc or .docx, link to WebDAV URL; otherwise, use download -->
            <a th:unless="${file.directory}"
               th:href="${file.name.endsWith('.doc') || file.name.endsWith('.docx')} ? @{/webdav/{path}(path=${currentPath + (currentPath == '' ? '' : '/') + file.name})} : @{/files/download(path=${currentPath + (currentPath == '' ? '' : '/') + file.name})}"
               th:text="${file.name}"></a>
        </td>
        <td th:text="${file.directory ? 'Directory' : 'File'}"></td>
        <td th:text="${file.directory ? '-' : file.length() + ' bytes'}"></td>
        <td th:text="${file.directory ? '-' : #vars.getFileIdByPath(file.toPath())}"></td>
        <td>
<!--            <form method="post" th:action="@{/files/delete}" style="display:inline;">-->
<!--                <input type="hidden" name="path" th:value="${currentPath + (currentPath == '' ? '' : '/') + file.name}"/>-->
<!--                <button type="submit" onclick="return confirm('Are you sure?')">Delete</button>-->
<!--            </form>-->
<!--            <button th:unless="${file.directory}" th:onclick="'fetchUrlById(\'' + ${#vars.getFileIdByPath(file.toPath())} + '\')'">Get URL by ID</button>-->
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
